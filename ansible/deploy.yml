---
- hosts: checkout
become: true
vars:
force_fail: "false"
tasks:
[checkout:vars] .
Page 20 of 40
    - name: Show target
      debug:
        msg: "target host = {{ inventory_hostname }}"
    - name: Install Java
      dnf:
        name: java-11-openjdk-headless
        state: present
    - name: App folder
      file:
        path: /opt/checkout
        state: directory
        mode: "0755"
    - name: systemd unit
      copy:
        dest: /etc/systemd/system/checkout.service
        content: |
          [Unit]
          Description=Harbour checkout
          After=network.target
          [Service]
          EnvironmentFile=-/etc/checkout.env
          ExecStart=/usr/bin/java -jar /opt/checkout/app.jar --
server.port=8443
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
    - name: Deploy with rollback
      block:
        - stat:
            path: /opt/checkout/app.jar
          register: cur
        - name: Back up current jar
          copy:
            src: /opt/checkout/app.jar
            dest: /opt/checkout/app.jar.bak
            remote_src: true
          when: cur.stat.exists
        - name: Copy new jar
          copy:
            src: "{{ jar_path }}"
            dest: /opt/checkout/app.jar
        - name: Health flag
          copy:
            dest: /etc/checkout.env
            content: "FAIL_HEALTH={{ force_fail }}\n"
        - name: Restart
          systemd:
            name: checkout
            state: restarted
            daemon_reload: true
            enabled: true
        - name: Health check
          uri:
            url: http://127.0.0.1:8443/health
            status_code: 200
          register: h
          retries: 4
          delay: 3
          until: h.status == 200
      rescue:
        - name: Rollback jar
          copy:
            src: /opt/checkout/app.jar.bak
            dest: /opt/checkout/app.jar
            remote_src: true
          when: cur.stat.exists
        - name: Clear failure flag
          copy:
            dest: /etc/checkout.env
            content: "FAIL_HEALTH=false\n"
        - name: Restart after rollback
          systemd:
            name: checkout
            state: restarted
        - name: Mark run as failed
          fail:
            msg: "Health check failed. ROLLED BACK to the previous jar.
